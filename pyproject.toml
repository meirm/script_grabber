[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "script-grabber"
version = "0.2.1"
description = "A job queue management system for distributed computing."
authors = [{name = "Meir Michanie", email = "meirm@riunx.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["job-queue", "distributed-computing", "task-scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
grabber = "script_grabber.grabber:main"
grabber-rerun = "script_grabber.rerun:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/script_grabber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, isolated, no file system dependencies)",
    "integration: Integration tests (real file system operations)",
    "e2e: End-to-end tests (full system tests with multiple processes)",
    "slow: Slow-running tests",
]
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["src/script_grabber"]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
