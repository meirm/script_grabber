[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "script-grabber"
version = "0.1.4"
description = "A job queue management system for distributed computing."
authors = [{name = "Meir Michanie", email = "meirm@riunx.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["job-queue", "distributed-computing", "task-scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
grabber = "script_grabber.grabber:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/script_grabber"]
